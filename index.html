<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Júlio John, senior UX/UI designer and art director for games and digital products. Case studies on mobile, PC and VR.">
<meta property="og:title" content="Júlio John Portfolio">
<meta property="og:description" content="Senior UX/UI designer and art director for games and digital products.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1d1d21">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1d21'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' dominant-baseline='middle' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='30' fill='%23eeece7'%3EJJ%3C/text%3E%3C/svg%3E">
<title>Júlio John Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Layout: quiet graphite chrome so the colorful game boards carry the page. Home = left-aligned statement, one featured case in a wide row, then a 2-column list. Each case takes its own project color for one full-bleed summary band and the "next case" block; everything else stays neutral. One family (Archivo) in two widths: expanded for display, normal for reading. Motion = one native shared-element morph from thumbnail to case header (View Transitions), plus a slow ambient color field behind the page (see Ambient below); nothing on scroll. */
:root{
  --ground:#1d1d21;   /* graphite page */
  --raised:#26262c;   /* thumbnails, inputs */
  --rule:#36363d;
  --text:#eeece7;     /* warm off-white */
  --dim:#aaa8a2;
  --ink:#eeece7;      /* per-project accent, set on case pages */
  --band:#26262c;     /* per-project deep color */
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gl:max(20px, env(safe-area-inset-left,0px));
  --gr:max(20px, env(safe-area-inset-right,0px));
  --wrap:1200px;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground)}
body{margin:0;color:var(--text);font-family:var(--f);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;font-stretch:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--ground)}
img{max-width:100%;display:block}
a{color:inherit}
p,li{text-wrap:pretty}
:focus-visible{outline:2px solid var(--text);outline-offset:3px;border-radius:3px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
.link{color:var(--text);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px;text-decoration-thickness:1.5px;transition:text-decoration-color .15s}
.link:hover{text-decoration-color:var(--text)}
button.link{background:none;border:0;padding:0;font:inherit;cursor:pointer}

/* Header */
/* Header: clear at the very top so the ambient field runs behind the name; once content scrolls under it the bar turns solid with a hairline, so text never shows through. */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:transparent;border-bottom:1px solid transparent;transition:border-color .25s,background-color .25s}
.head.stuck,.head.open{background:var(--ground)}
.head.stuck{border-bottom-color:var(--rule)}
.head .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.mark{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:750;font-size:18px;font-stretch:112%;letter-spacing:-.01em;min-width:0}
.mark small{font-weight:500;font-size:14px;font-stretch:100%;letter-spacing:0;color:var(--dim);padding-left:12px;border-left:1px solid var(--rule);white-space:nowrap}
@media (max-width:900px){.mark small{display:none}}
.nav{display:flex;align-items:center;gap:28px;font-size:15px}
.nav a,.nav button{position:relative;background:none;border:0;padding:6px 0;font:inherit;color:var(--dim);text-decoration:none;cursor:pointer;transition:color .15s}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .35s var(--ease)}
.nav a:hover::after,.nav a[aria-current="page"]::after{transform:scaleX(1);transform-origin:left}
.nav a:hover,.nav button:hover{color:var(--text)}
.nav a[aria-current="page"]{color:var(--text)}
.nav button[data-contact]{padding:8px 16px;border:1px solid var(--rule);border-radius:999px;color:var(--text);background:color-mix(in srgb,var(--text) 5%,transparent);transition:background-color .2s,color .2s,border-color .2s}
.nav button[data-contact]:hover{background:var(--text);border-color:var(--text);color:var(--ground)}
.burger{display:none;background:none;border:0;padding:10px;margin-right:-10px;cursor:pointer}
.burger i{display:block;width:22px;height:2px;background:var(--text);margin:5px 0;transition:transform .2s var(--ease),opacity .2s}
.burger[aria-expanded="true"] i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger[aria-expanded="true"] i:nth-child(2){opacity:0}
.burger[aria-expanded="true"] i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.drawer{border-top:1px solid var(--rule);padding-block:4px 12px}
.drawer a,.drawer button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);font:600 20px/1 var(--f);font-stretch:112%;padding:14px 0;text-decoration:none;cursor:pointer}
@media (max-width:720px){.nav{display:none}.burger{display:block}}
@media (min-width:721px){.drawer{display:none!important}}
.progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink);transform-origin:0 50%;transform:scaleX(0)}

/* Home */
.hero{padding-block:80px 64px}
.hero h1{margin:0 0 24px;max-width:15ch;font-weight:760;font-stretch:115%;font-size:clamp(40px,5.8vw,68px);line-height:1.02;letter-spacing:-.03em;text-wrap:balance}
.hero p{margin:0 0 28px;max-width:56ch;color:var(--dim);font-size:clamp(17px,1.5vw,19px);line-height:1.6}
.hero p b{color:var(--text);font-weight:600}
.inline-links{display:flex;flex-wrap:wrap;gap:12px 28px;font-size:16px;font-weight:500}
@media (max-width:720px){.hero{padding-block:64px 40px}}

.group{padding-bottom:72px}
.group-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:20px;margin-bottom:28px}
.group-head h2{margin:0;font-weight:700;font-stretch:112%;font-size:25px;line-height:1.2;letter-spacing:-.01em}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:44px 24px}
.grid.product{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1000px){.grid,.grid.product{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.grid{gap:28px 14px}.grid.product{grid-template-columns:1fr}}

.item{display:flex;flex-direction:column;gap:14px;text-decoration:none;min-width:0}
.item .thumb{aspect-ratio:1/1;overflow:hidden;background:var(--raised);max-width:100%}
.grid.product .thumb{aspect-ratio:16/9}
.item .thumb img{width:100%;height:100%;object-fit:cover;transition:filter .2s}
.item:hover .thumb img{filter:brightness(1.08)}
.item h3{margin:0;font-weight:650;font-stretch:105%;font-size:20px;line-height:1.2;letter-spacing:-.005em;transition:color .15s}
.item:hover h3{color:var(--pi)}
.item .kind{margin:4px 0 0;color:var(--dim);font-size:14px}
.item .lede{margin:8px 0 0;color:#c9c7c1;font-size:15px;line-height:1.55;max-width:46ch}
.item.lead{grid-column:span 2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.item.lead h3{font-size:clamp(24px,2.6vw,32px);font-weight:720;font-stretch:112%;line-height:1.08;letter-spacing:-.015em}
.item.lead .lede{font-size:16px;margin-top:12px}
.item.lead .facts-line{margin-top:20px;display:flex;flex-wrap:wrap;gap:10px 24px;font-size:14px}
.item.lead .facts-line span{color:var(--dim)}
.item.lead .facts-line b{display:block;color:var(--text);font-weight:600;font-size:15px}
@media (max-width:600px){
  .item{gap:10px}
  .item h3{font-size:16px}
  .item .kind{font-size:13px;margin-top:2px}
  .grid:not(.product) .item:not(.lead) .lede{display:none}
  .item.lead{gap:14px;align-items:start}
  .item.lead h3{font-size:20px}
  .item.lead .lede{font-size:14px;margin-top:8px}
  .item.lead .facts-line{display:none}
}

/* Case */
.case-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end;padding-block:36px 40px}
.back{grid-column:1/-1;justify-self:start;color:var(--dim);text-decoration:none;font-size:15px;display:inline-flex;gap:8px;align-items:center}
.back:hover{color:var(--text)}
.back svg{width:16px;height:16px;transition:transform .2s var(--ease)}
.back:hover svg{transform:translateX(-3px)}
.case-head .kind{margin:0 0 10px;color:var(--dim);font-size:15px}
.case-head h1{margin:0 0 16px;font-weight:760;font-stretch:115%;font-size:clamp(38px,6vw,72px);line-height:1;letter-spacing:-.03em;text-wrap:balance}
.case-head .lede{margin:0;font-size:19px;color:var(--dim);max-width:56ch}
.case-head .cover{width:clamp(96px,20vw,240px);height:auto;aspect-ratio:1/1;object-fit:cover;max-width:100%}
@media (max-width:720px){.case-head{grid-template-columns:1fr;gap:20px}.case-head .cover{grid-row:2;width:96px}.case-head .lede{font-size:17px}}

.band{background:var(--band);color:#fff;margin-bottom:64px}
.band .wrap{padding-block:26px 28px;display:grid;gap:22px}
.facts{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,128px),1fr));gap:14px 16px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.18)}
.facts dt{font-size:13px;color:rgba(255,255,255,.66)}
.facts dd{margin:2px 0 0;font-weight:600;font-size:15px;line-height:1.35}
.story{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.story h3{margin:0 0 8px;font-size:15px;font-weight:700;font-stretch:112%;color:var(--ink)}
.story p,.story ul{margin:0;color:rgba(255,255,255,.88);font-size:15px;line-height:1.5}
.story ul{padding-left:18px}
.story li{margin-bottom:5px}
.story li:last-child{margin-bottom:0}
.impact{display:grid;gap:14px}
.impact div b{display:block;font-weight:760;font-stretch:115%;font-size:28px;line-height:1.05;color:#fff}
.impact div span{display:block;color:rgba(255,255,255,.78);font-size:14px;line-height:1.4;margin-top:2px}
.play-button{display:inline-flex;align-items:center;gap:12px;padding:13px 18px;border:1px solid rgba(255,255,255,.35);border-radius:10px;background:rgba(255,255,255,.08);color:#fff;text-decoration:none;font-weight:650;line-height:1.3;transition:background .2s,border-color .2s}
.play-button:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.7)}
.play-button img{width:30px;height:30px;object-fit:contain;flex:none}
@media (max-width:860px){.story{grid-template-columns:1fr;gap:26px}}

.boards{display:flex;flex-direction:column;gap:64px;align-items:stretch;width:100%;max-width:960px;margin-inline:auto}
.board{margin:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.board button{all:unset;cursor:zoom-in;display:block;width:100%;position:relative}
.board button:focus-visible{outline:2px solid var(--text);outline-offset:4px}
.board img{width:100%;height:auto;background:var(--raised)}
.board figcaption{width:100%;display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:10px;color:var(--dim);font-size:15px;line-height:1.5}
.board figcaption b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.board figcaption strong{color:var(--text);font-weight:600}
.board figcaption > span:only-child{grid-column:1/-1}
.board video{display:block;width:100%;height:auto;background:#111}
.board iframe{display:block;width:100%;aspect-ratio:16/9;border:0;background:#111}

.details{margin-top:96px;border-top:1px solid var(--rule);padding-block:48px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:32px}
.details h2{margin:0;font-weight:700;font-stretch:112%;font-size:25px;line-height:1.2}
.details .body{max-width:66ch;min-width:0}
.details p{margin:0 0 14px;color:#d8d6d0}
.details h3{margin:28px 0 10px;font-size:15px;font-weight:700;font-stretch:112%}
.details ul{margin:0;padding-left:18px;color:#d8d6d0}
.details li{margin-bottom:6px}
.credits{list-style:none;padding:0!important;border-top:1px solid var(--rule)}
.credits li{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding:10px 0;margin:0!important}
.credits span{color:var(--dim)}
@media (max-width:820px){.details{grid-template-columns:1fr;gap:10px}}

.next{display:block;background:var(--nb);color:#fff;text-decoration:none;margin-top:72px}
.next .wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center;padding-block:28px}
.next img{width:88px;height:88px;object-fit:cover}
.next small{display:block;font-size:14px;color:rgba(255,255,255,.72)}
.next strong{display:block;font-weight:760;font-stretch:115%;font-size:clamp(22px,3.4vw,36px);line-height:1.05;letter-spacing:-.015em}
.next svg{width:28px;height:28px;transition:transform .2s var(--ease)}
.next:hover svg{transform:translateX(6px)}
@media (max-width:520px){.next img{width:64px;height:64px}.next .wrap{gap:16px}}

.side{position:fixed;top:50%;z-index:20;transform:translateY(-50%);width:44px;height:64px;display:grid;place-items:center;background:transparent;color:var(--text);text-decoration:none;border-radius:10px;opacity:.65;transition:opacity .15s,background .15s}
.side:hover,.side:focus-visible{opacity:1;background:rgba(29,29,33,.9)}
.side svg{width:28px;height:28px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.side.prev{left:max(8px, env(safe-area-inset-left,0px))}
.side.nxt{right:max(8px, env(safe-area-inset-right,0px))}
@media (min-width:760px){.case-view #app .wrap{padding-left:max(var(--gl),64px);padding-right:max(var(--gr),64px)}}
@media (max-width:759px){.side{display:none}}

/* About */
.about{padding-block:64px 72px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.8fr);gap:48px}
.about h1{margin:0;font-weight:760;font-stretch:115%;font-size:clamp(38px,5vw,60px);line-height:1;letter-spacing:-.025em}
.about .side-note{margin:18px 0 0;color:var(--dim);font-size:15px;max-width:30ch}
.about .intro{margin:0 0 12px;font-size:19px;line-height:1.6;color:#d8d6d0;max-width:60ch}
.about .intro b{color:var(--text);font-weight:600}
.about h2{margin:48px 0 16px;font-weight:700;font-stretch:112%;font-size:20px;line-height:1.2}
.timeline{list-style:none;padding:0;margin:0;border-top:1px solid var(--rule)}
.timeline > li{padding:22px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 20px}
.timeline .co{font-weight:700;font-stretch:105%;font-size:18px}
.timeline .when{color:var(--dim);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:3px}
.timeline .role{grid-column:1/-1;color:var(--text);font-size:15.5px}
.timeline .role span{color:var(--dim)}
.timeline ul{grid-column:1/-1;margin:10px 0 0;padding-left:18px;color:var(--dim);font-size:15px}
.timeline ul li{margin-bottom:6px}
.timeline ul b{color:var(--text);font-weight:600}
.timeline .cases{grid-column:1/-1;margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:12px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:2em minmax(0,1fr);gap:8px;color:var(--dim)}
.steps li::before{content:counter(s);font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.steps strong{color:var(--text);font-weight:600}
.kit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.kit h3{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--dim)}
.kit p{margin:0;font-size:16px;line-height:1.7}
.tool-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 24px}
.tool-list li{display:flex;align-items:center;gap:12px;min-width:0;font-size:16px}
.tool-list img{width:30px;height:30px;object-fit:contain;flex:none}
.tool-list .code-logos{display:flex;align-items:center;width:30px;flex:none}
.code-logos img{width:18px;height:26px}
.code-logos img+img{margin-left:-6px}
.social-link{display:inline-flex;align-items:center;gap:8px}
.social-link img{width:19px;height:19px;object-fit:contain;flex:none}
@media(max-width:520px){.tool-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 16px}}
@media (max-width:860px){.about{grid-template-columns:1fr;gap:16px;padding-block:44px 56px}.about .side-note{display:none}}
@media (max-width:520px){.timeline > li{grid-template-columns:1fr}.timeline .when{padding-top:0;order:-1}.kit{grid-template-columns:1fr}}

/* Contact */
.contact{border-top:1px solid var(--rule)}
.contact .wrap{padding-block:64px 36px}
.contact p{margin:0 0 14px;color:var(--dim);font-size:17px}
.email{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 20px;margin-bottom:28px}
.email code{font:760 clamp(22px,4.4vw,48px)/1.05 var(--f);font-stretch:115%;letter-spacing:-.02em;color:var(--text);user-select:all;overflow-wrap:anywhere}
.email button{background:var(--text);color:var(--ground);border:0;border-radius:999px;padding:10px 16px;font:600 14px/1 var(--f);cursor:pointer;transition:transform .1s}
.email button:active{transform:scale(.97)}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px 28px;border-top:1px solid var(--rule);padding-top:20px;color:var(--dim);font-size:14px}

/* Viewer */
.viewer{overflow:auto;border:0;padding:0;margin:0;max-width:none;max-height:none;width:100%;height:100%;background:rgba(12,12,14,.97);color:var(--text)}
.viewer::backdrop{background:rgba(12,12,14,.9)}
.vbar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px var(--gr) 12px var(--gl);padding-top:max(12px, env(safe-area-inset-top,0px));background:rgba(12,12,14,.94);font-size:14px;color:var(--dim)}
.vbar button{background:var(--raised);border:1px solid var(--rule);color:var(--text);border-radius:999px;padding:9px 14px;font:500 14px/1 var(--f);cursor:pointer}
.vimg{padding:8px var(--gr) 40px var(--gl);display:flex;justify-content:center}
.viewer img{max-width:min(100%,1600px);height:auto}

.toast{position:fixed;left:50%;bottom:max(24px, calc(env(safe-area-inset-bottom,0px) + 16px));transform:translate(-50%,10px);background:var(--text);color:var(--ground);font:600 14px/1 var(--f);padding:12px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* The one motion moment: thumbnail morphs into the case header cover */
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
::view-transition-group(cover){animation-duration:.42s;animation-timing-function:var(--ease)}

/* Copy email confirms on the button itself */
button[data-copy].copied{color:var(--ink)}
.email button[data-copy].copied{background:var(--ink);color:var(--ground)}
.email button[data-copy]{min-width:7.5em}
/* Ambient. Three soft color fields drift behind the page, taken from the projects' own deep colors, under a fine static grain. Hovering a case on the home pulls the room toward that project's color; a case page settles into its palette. Cards tilt slightly toward the cursor. Pure CSS motion, no canvas. */
@property --a1{syntax:"<color>";inherits:true;initial-value:#123a8c}
@property --a2{syntax:"<color>";inherits:true;initial-value:#34103f}
@property --a3{syntax:"<color>";inherits:true;initial-value:#0f3a2e}
:root{--a1:#123a8c;--a2:#34103f;--a3:#0f3a2e;transition:--a1 1.4s var(--ease),--a2 1.4s var(--ease),--a3 1.4s var(--ease)}
body{background:transparent}
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.ambient i{position:absolute;width:75vmax;height:75vmax;border-radius:50%;opacity:.5}
.ambient i:nth-child(1){top:-30vmax;left:-20vmax;background:radial-gradient(closest-side,var(--a1),transparent);animation:d1 34s ease-in-out infinite alternate}
.ambient i:nth-child(2){top:5vh;right:-35vmax;background:radial-gradient(closest-side,var(--a2),transparent);animation:d2 41s ease-in-out infinite alternate}
.ambient i:nth-child(3){bottom:-40vmax;left:15vw;opacity:.24;background:radial-gradient(closest-side,var(--a3),transparent);animation:d3 47s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(18vw,14vh) scale(1.15)}}

.item .thumb{position:relative;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.item .thumb::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.14),transparent 60%)}
@media (hover:hover){
  .item:hover .thumb{box-shadow:0 24px 60px -24px color-mix(in srgb,var(--pi) 45%,transparent)}
  .item:hover .thumb::after{opacity:1}
}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function mediaAfter(p,index){
  const models=(p.models||[]).filter(m=>m.after===index).map(m=>`<figure class="board"><iframe src="${m.src}" title="${esc(m.title)}" loading="lazy" allow="fullscreen; xr-spatial-tracking" allowfullscreen></iframe><figcaption><span><strong>${esc(m.title)}.</strong> Explore the original interactive model on Sketchfab.</span></figcaption></figure>`);

  return models.concat(videos).join("");
}
const reduce=matchMedia("(prefers-reduced-motion: reduce)");
let stopVideoPlayback=()=>{};
function watchVideos(){
  if(reduce.matches||!('IntersectionObserver' in window))return;
  const states=new Map();
  let active=true;
  const play=(video,state)=>{
    if(active&&state.visible&&!state.userPaused&&!document.hidden&&!video.ended)video.play().catch(()=>{});
  };
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      const video=entry.target,state=states.get(video);
      state.visible=entry.isIntersecting&&entry.intersectionRatio>=.35;
      if(state.visible)play(video,state);
      else{state.userPaused=false;video.pause();}
    });
  },{threshold:[0,.35]});
  app.querySelectorAll('video').forEach(video=>{
    const state={visible:false,userPaused:false};states.set(video,state);
    video.addEventListener('pause',()=>{
      if(active&&state.visible&&!document.hidden&&!video.ended)state.userPaused=true;
    });
    video.addEventListener('play',()=>{state.userPaused=false;});
    observer.observe(video);
  });
  const visibility=()=>states.forEach((state,video)=>document.hidden?video.pause():play(video,state));
  document.addEventListener('visibilitychange',visibility);
  stopVideoPlayback=()=>{
    active=false;observer.disconnect();document.removeEventListener('visibilitychange',visibility);
    states.forEach((state,video)=>video.pause());
  };
}

  <div class="wrap">
    <div class="boards">${p.boards.map(([b,w,h,t,cap],k)=>{const s=img(b,w);const num=String(k+1).padStart(2,"0");return `

        ${d.credits?`<h3>Team</h3><ul class="credits">${d.credits.map(([r,nm,u])=>`<li><span>${esc(r)}</span>${u?`<a class="link" href="${u}" target="_blank" rel="noopener">${esc(nm)}</a>`:esc(nm)}</li>`).join("")}</ul>`:""}

    <div class="wrap">
      <img src="${nc.src}" alt="" width="88" height="88" loading="lazy">

  <a class="side nxt" href="#${next.id}" aria-label="Next case: ${esc(next.name)}" title="Next: ${esc(next.name)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></a>`;
  app.querySelectorAll("[data-zoom]").forEach(b=>b.addEventListener("click",()=>openViewer(b.dataset.zoom,b.dataset.cap)));
  watchVideos();
}

/* Viewer */
const viewer=document.getElementById("viewer"),vimg=document.getElementById("vimg");
function openViewer(url,cap){vimg.src=url;vimg.alt=cap;document.getElementById("vcap").textContent=cap;viewer.showModal?viewer.showModal():null}
document.getElementById("vclose").addEventListener("click",()=>viewer.close());
viewer.addEventListener("click",e=>{if(e.target===viewer||e.target.classList.contains("vimg"))viewer.close()});
viewer.addEventListener("close",()=>vimg.removeAttribute("src"));

/* Copy email, contact, menu */
const toast=document.getElementById("toast");let tt;
function say(m){toast.textContent=m;toast.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove("show"),1800)}
const burger=document.getElementById("burger"),drawer=document.getElementById("drawer");
const head=document.querySelector(".head");
function closeDrawer(){drawer.hidden=true;burger.setAttribute("aria-expanded","false");head.classList.remove("open")}
burger.addEventListener("click",()=>{drawer.hidden=!drawer.hidden;burger.setAttribute("aria-expanded",String(!drawer.hidden));head.classList.toggle("open",!drawer.hidden)});
document.addEventListener("click",e=>{
  if(e.target.closest("[data-copy]")){try{navigator.clipboard.writeText(EMAIL).then(()=>say("Email copied"),()=>say(EMAIL))}catch(err){say(EMAIL)}}
  if(e.target.closest("[data-contact]")){closeDrawer();document.getElementById("contact").scrollIntoView({behavior:reduce.matches?"auto":"smooth"})}
});

/* Header hairline once content scrolls under it */
const stick=()=>head.classList.toggle("stuck",scrollY>8);
addEventListener("scroll",stick,{passive:true});stick();

/* Reading progress on case pages */
const bar=document.getElementById("progress");let onCase=false,tick=false;
addEventListener("scroll",()=>{if(!onCase||tick)return;tick=true;requestAnimationFrame(()=>{const m=root.scrollHeight-root.clientHeight;bar.style.transform=`scaleX(${m>0?Math.min(1,root.scrollTop/m):0})`;tick=false})},{passive:true});

/* Routing with an optional shared-element morph */
let current=null;
function render(id){
  stopVideoPlayback();stopVideoPlayback=()=>{};
  const p=P.find(x=>x.id===id);
  root.classList.toggle("case-view",!!p);
  closeDrawer();if(viewer.open)viewer.close();
  onCase=!!p;bar.style.transform="scaleX(0)";
  if(!p){root.style.setProperty("--ink","#eeece7");root.style.setProperty("--band","#26262c")}
  document.querySelectorAll("[data-nav]").forEach(a=>{const on=(a.dataset.nav==="about")===(id==="about");on?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});
  /* A content error in one case must never leave a blank or stuck page: fall back to the home list */
  try{if(p)project(p);else if(id==="about")about();else home()}catch(err){console.error(err);home()}
  document.title=p?`${p.name} · Júlio John`:id==="about"?"About · Júlio John":"Júlio John Portfolio";
}
function go(id,{fromThumb=null,push=true}={}){
  const prevId=current;current=id;
  const swap=()=>{
    if(push&&location.hash.slice(1)!==id)history.pushState(null,"","#"+id);
    render(id);
    const cover=document.getElementById("case-cover");
    if(cover&&fromThumb)cover.style.viewTransitionName="cover";
    const back=P.find(x=>x.id===prevId)&&!P.find(x=>x.id===id)?app.querySelector(`.item[data-id="${prevId}"]`):null;
    if(back){const t=back.querySelector(".thumb img");if(t)t.style.viewTransitionName="cover";back.scrollIntoView({block:"center"})}
    else window.scrollTo(0,0);
  };
  if(!document.startViewTransition||reduce.matches){swap();return}
  if(fromThumb)fromThumb.style.viewTransitionName="cover";
  else{const c=document.getElementById("case-cover");if(c&&!P.find(x=>x.id===id))c.style.viewTransitionName="cover";}
  const t=document.startViewTransition(swap);
  t.finished.finally(()=>document.querySelectorAll("[style*='view-transition-name']").forEach(el=>el.style.viewTransitionName=""));
}
app.addEventListener("click",e=>{
  const a=e.target.closest("a.item");
  if(a&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey){e.preventDefault();go(a.dataset.id,{fromThumb:a.querySelector(".thumb img")})}
  const b=e.target.closest("a[data-back]");
  if(b&&!e.metaKey&&!e.ctrlKey){e.preventDefault();go("work")}
});
addEventListener("popstate",()=>go(location.hash.slice(1)||"work",{push:false}));
addEventListener("hashchange",()=>{const id=location.hash.slice(1)||"work";if(id!==current)go(id,{push:false})});
document.addEventListener("keydown",e=>{
  if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest?.('video,audio,input,textarea,select,[contenteditable]:not([contenteditable="false"])'))return;
  if(viewer.open||!P.find(x=>x.id===current))return;
  if(e.key==="ArrowLeft")document.querySelector(".side.prev")?.click();
  if(e.key==="ArrowRight")document.querySelector(".side.nxt")?.click();
});
/* Ambient layer. Everything below is decoration: each piece runs inside try/catch, so if a browser lacks a feature the portfolio still renders exactly as before. */
const fine=matchMedia("(hover:hover) and (pointer:fine)");
const safe=(fn)=>{try{fn()}catch(e){console.warn("fx",e)}};

/* Copy email: the button itself confirms, the toast stays as the accessible message */
document.addEventListener("click",e=>{const b=e.target.closest("button[data-copy]");if(!b||b.dataset.label)return;
  b.dataset.label=b.textContent;b.textContent="Copied";b.classList.add("copied");
  setTimeout(()=>{b.textContent=b.dataset.label;delete b.dataset.label;b.classList.remove("copied")},1600)});

/* Run enhance() after every route render */
const baseRender=render;
render=function(id){baseRender(id);safe(()=>enhance(id))};

/* B · Ambient color: the room takes the color of what you look at */
const HOME=["#123a8c","#34103f","#0f3a2e"];
function amb(a,b,c){root.style.setProperty("--a1",a);root.style.setProperty("--a2",b);root.style.setProperty("--a3",c)}
if(fine.matches){
  app.addEventListener("pointerover",e=>{const it=e.target.closest&&e.target.closest("a.item");if(!it)return;const p=P.find(x=>x.id===it.dataset.id);if(p)amb(p.band,p.band,p.ink)});
  app.addEventListener("pointerout",e=>{const it=e.target.closest&&e.target.closest("a.item");if(it&&!it.contains(e.relatedTarget)&&!P.find(x=>x.id===current))amb(...HOME)});
  /* Gentle tilt and light toward the cursor */
  app.addEventListener("pointermove",e=>{if(reduce.matches)return;const t=e.target.closest&&e.target.closest(".item .thumb");if(!t)return;
    const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    t.style.transform=`perspective(1000px) rotateX(${(-y*5).toFixed(2)}deg) rotateY(${(x*5).toFixed(2)}deg)`;
    t.style.setProperty("--mx",e.clientX-r.left+"px");t.style.setProperty("--my",e.clientY-r.top+"px")},{passive:true});
  app.addEventListener("pointerout",e=>{const t=e.target.closest&&e.target.closest(".item .thumb");if(t&&!t.contains(e.relatedTarget))t.style.transform=""});
  app.addEventListener("pointerdown",e=>{const t=e.target.closest&&e.target.closest(".item .thumb");if(t)t.style.transform=""});
}

function enhance(id){
  const p=P.find(x=>x.id===id);
  p?amb(p.band,p.band,p.ink):amb(...HOME);
}

current=location.hash.slice(1)||"work";render(current);
</script>
